[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "monte-carlo-portfolio-sim"
version = "0.1.0"
description = "Reproducible portfolio simulations, drawn in black and a spectrum of outcomes."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Victor Pimenta"}]
dependencies = ["numpy>=2.0,<3", "pandas>=2.2,<4", "matplotlib>=3.9,<4", "pillow>=10,<13"]

[project.optional-dependencies]
market = ["yfinance>=0.2.54,<2"]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[project.scripts]
portfolio-sim = "portfolio_sim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
portfolio_sim = ["fixtures/*.csv", "fixtures/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["ffmpeg: encode a real animation when ffmpeg is available"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
